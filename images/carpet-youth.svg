<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Дагестанский ковровый орнамент в тёплых красно-оранжево-золотых цветах">
  <defs>
    <pattern id="outer" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 3 27 16 16 29 5 16Z" fill="none" stroke="#102a36" stroke-width="2"/>
      <circle cx="16" cy="16" r="3" fill="#e86b2a"/>
    </pattern>
    <pattern id="hook" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M6 32V8h22V4" fill="none" stroke="#9b2c1e" stroke-width="4" stroke-linecap="square"/>
      <path d="M26 32V18h12" fill="none" stroke="#e86b2a" stroke-width="3"/>
    </pattern>
    <pattern id="field" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 8 42 28 28 48 14 28Z" fill="none" stroke="#f2c14e" stroke-width="1.6" opacity=".65"/>
      <path d="M28 17 35 28 28 39 21 28Z" fill="#e86b2a" opacity=".45"/>
      <circle cx="28" cy="28" r="2" fill="#f8e7c2" opacity=".8"/>
    </pattern>
  </defs>

  <!-- кайма -->
  <rect width="800" height="450" fill="#102a36"/>
  <rect x="8" y="8" width="784" height="434" fill="#f2c14e"/>
  <rect x="8" y="8" width="784" height="434" fill="url(#outer)"/>
  <rect x="28" y="28" width="744" height="394" fill="#f8e7c2"/>
  <rect x="28" y="28" width="744" height="394" fill="url(#hook)"/>
  <rect x="48" y="48" width="704" height="354" fill="#9b2c1e"/>
  <rect x="48" y="48" width="704" height="354" fill="url(#field)"/>

  <!-- центральная медальонная розетка -->
  <g transform="translate(400 225)">
    <path d="M0-150 150 0 0 150-150 0Z" fill="#f8e7c2" stroke="#102a36" stroke-width="3"/>
    <path d="M0-132 132 0 0 132-132 0Z" fill="#7a1f16"/>
    <path d="M0-108 108 0 0 108-108 0Z" fill="#f2c14e" stroke="#102a36" stroke-width="2"/>
    <path d="M0-84 84 0 0 84-84 0Z" fill="#9b2c1e"/>
    <path d="M0-62 62 0 0 62-62 0Z" fill="#f8e7c2"/>
    <g fill="#e86b2a">
      <path d="M0-50 12-16 48-16 19 6 30 40 0 20-30 40-19 6-48-16-12-16Z"/>
    </g>
    <circle r="15" fill="#f2c14e" stroke="#102a36" stroke-width="2"/>
    <circle r="6" fill="#9b2c1e"/>
    <!-- угловые крючки внутри медальона -->
    <g fill="none" stroke="#f2c14e" stroke-width="3">
      <path d="M-96-96h30v30M96-96H66v30M-96 96h30V66M96 96H66V66"/>
    </g>
  </g>

  <!-- боковые медальоны -->
  <g transform="translate(150 225)">
    <path d="M0-88 88 0 0 88-88 0Z" fill="#f8e7c2" stroke="#102a36" stroke-width="3"/>
    <path d="M0-68 68 0 0 68-68 0Z" fill="#e86b2a"/>
    <path d="M0-44 44 0 0 44-44 0Z" fill="#f2c14e"/>
    <path d="M0-24 24 0 0 24-24 0Z" fill="#7a1f16"/>
    <circle r="7" fill="#f8e7c2"/>
  </g>
  <g transform="translate(650 225)">
    <path d="M0-88 88 0 0 88-88 0Z" fill="#f8e7c2" stroke="#102a36" stroke-width="3"/>
    <path d="M0-68 68 0 0 68-68 0Z" fill="#e86b2a"/>
    <path d="M0-44 44 0 0 44-44 0Z" fill="#f2c14e"/>
    <path d="M0-24 24 0 0 24-24 0Z" fill="#7a1f16"/>
    <circle r="7" fill="#f8e7c2"/>
  </g>

  <!-- угловые мотивы «бараньи рога» -->
  <g fill="none" stroke="#f2c14e" stroke-width="5" stroke-linecap="round">
    <path d="M60 60c40 0 56 18 56 46M60 60c0 40 18 56 46 56"/>
    <path d="M740 60c-40 0-56 18-56 46M740 60c0 40-18 56-46 56"/>
    <path d="M60 390c40 0 56-18 56-46M60 390c0-40 18-56 46-56"/>
    <path d="M740 390c-40 0-56-18-56-46M740 390c0-40-18-56-46-56"/>
  </g>
  <g fill="#f8e7c2">
    <circle cx="60" cy="60" r="7"/><circle cx="740" cy="60" r="7"/>
    <circle cx="60" cy="390" r="7"/><circle cx="740" cy="390" r="7"/>
  </g>
</svg>
